name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # used by the release workflow before anything is published

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ETCD_VERSION: v3.5.21
  K3S_VERSION: v1.33.5+k3s1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify module checksums
        run: go mod verify

      - name: Check that go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-formatted: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet .

      - name: Check license headers
        run: |
          for f in *.go test.sh .github/workflows/*.yml; do
            grep -q 'SPDX-License-Identifier: FSL-1.1-ALv2' "$f" || { echo "::error file=$f::Missing license header"; exit 1; }
          done

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run unit tests with race detector
        run: go test -race -count=1 .

  integration-tests:
    name: Integration tests (etcd, mTLS)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download etcd ${{ env.ETCD_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/etcd.tgz" \
            "https://github.com/etcd-io/etcd/releases/download/${ETCD_VERSION}/etcd-${ETCD_VERSION}-linux-amd64.tar.gz"
          tar xzf "$RUNNER_TEMP/etcd.tgz" -C "$RUNNER_TEMP"
          echo "E2E_ETCD_DIR=$RUNNER_TEMP/etcd-${ETCD_VERSION}-linux-amd64" >> "$GITHUB_ENV"

      - name: Run attack and mTLS tests with race detector
        run: go test -race -count=1 -v .

  fuzzing:
    name: Fuzzing (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzDecKey
          - FuzzOpenRecord
          - FuzzParseReceipt
          - FuzzParseRange
          - FuzzParseCheckpoint
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fuzz for 60 seconds
        env:
          TARGET: ${{ matrix.target }}
        run: go test -run '^$' -fuzz "^${TARGET}\$" -fuzztime 60s .

      - name: Upload failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: testdata/fuzz/
          if-no-files-found: ignore

  end-to-end:
    name: End-to-end test (k3s, three instances, rollback attack)
    needs: [unit-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download etcd ${{ env.ETCD_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/etcd.tgz" \
            "https://github.com/etcd-io/etcd/releases/download/${ETCD_VERSION}/etcd-${ETCD_VERSION}-linux-amd64.tar.gz"
          tar xzf "$RUNNER_TEMP/etcd.tgz" -C "$RUNNER_TEMP"
          echo "ETCD_DIR=$RUNNER_TEMP/etcd-${ETCD_VERSION}-linux-amd64" >> "$GITHUB_ENV"

      - name: Download k3s ${{ env.K3S_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/k3s" "https://github.com/k3s-io/k3s/releases/download/${K3S_VERSION//+/%2B}/k3s"
          chmod +x "$RUNNER_TEMP/k3s"
          echo "K3S_BIN=$RUNNER_TEMP/k3s" >> "$GITHUB_ENV"

      - name: Build binary
        run: go build -o veil-proxy .

      - name: Run end-to-end test
        run: sudo --preserve-env=ETCD_DIR,K3S_BIN ./test.sh

      - name: Make logs readable (the test ran as root)
        if: failure()
        run: sudo chmod -R a+rX .testrun

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: end-to-end-logs
          path: |
            .testrun/*.log
            .testrun/*.state
          include-hidden-files: true
          if-no-files-found: ignore
