#
# Releases are created by pushing a version tag, exactly like Go modules:
#
#   git tag v1.2.3 && git push origin v1.2.3        stable release
#   git tag v1.3.0-rc.1 && git push origin v1.3.0-rc.1   pre-release
#
# Image tags on ghcr.io/<owner>/veil-proxy:
#
#   v1.2.3        always
#   v1.2, v1      stable releases only (v1 only from v1.0.0 on; v0 is not stable by definition)
#   latest        newest stable release only
#
# Every image is built for linux/amd64 and linux/arm64, carries an SBOM and a
# build provenance attestation, and is signed with Sigstore (keyless).

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check version tag
    runs-on: ubuntu-24.04
    steps:
      - name: Check that the tag is a semantic version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "::error::Tag '$TAG' is not a semantic version like v1.2.3 or v1.3.0-rc.1"
            exit 1
          fi
          echo "Releasing $TAG"

  tests:
    name: Tests
    needs: [check-version]
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  publish-image:
    name: Publish image to GitHub Container Registry
    needs: [tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless signing with Sigstore
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/veil-proxy" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
          labels: |
            org.opencontainers.image.title=veil-proxy
            org.opencontainers.image.description=End-to-end encrypting, verifying etcd proxy of Veilplane
            org.opencontainers.image.licenses=FSL-1.1-ALv2
            org.opencontainers.image.vendor=Veilplane

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with Sigstore (keyless)
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Write release summary
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## veil-proxy ${GITHUB_REF_NAME}"
            echo
            echo "Image: \`${IMAGE}@${DIGEST}\`"
            echo
            echo "Tags:"
            while read -r tag; do echo "- \`$tag\`"; done <<< "$TAGS"
            echo
            echo "Verify the signature:"
            echo
            echo "\`\`\`"
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
