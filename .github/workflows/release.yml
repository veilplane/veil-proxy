#
# Releases are created by pushing a version tag, exactly like Go modules:
#
#   git tag v1.2.3 && git push origin v1.2.3        stable release
#   git tag v1.3.0-rc.1 && git push origin v1.3.0-rc.1   pre-release
#
# The GitHub release gets the binaries veil-proxy-linux-amd64 and -arm64 (what
# veilctl's install.sh downloads), checksums.txt and a Sigstore bundle per file.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check version tag
    runs-on: ubuntu-24.04
    steps:
      - name: Check that the tag is a semantic version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "::error::Tag '$TAG' is not a semantic version like v1.2.3 or v1.3.0-rc.1"
            exit 1
          fi
          echo "Releasing $TAG"

  tests:
    name: Tests
    needs: [check-version]
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  github-release:
    name: Create GitHub release with binaries
    needs: [tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
      id-token: write # keyless signing with Sigstore
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build static binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.buildVersion=${VERSION}" -o "dist/veil-proxy-linux-$arch" .
          done
          cp LICENSE.md NOTICE.md dist/
          (cd dist && sha256sum veil-proxy-linux-* > checksums.txt)

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign binaries with Sigstore (keyless)
        run: |
          for f in veil-proxy-linux-amd64 veil-proxy-linux-arm64 checksums.txt; do
            cosign sign-blob --yes --bundle "dist/$f.sigstore.json" "dist/$f"
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease dist/*
